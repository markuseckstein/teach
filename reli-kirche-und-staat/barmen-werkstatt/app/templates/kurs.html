<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Name}} — Barmen-Werkstatt</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<main>
		<h1>{{.Name}}</h1>
		<p class="meta">Beitrittscode <strong>{{.Beitrittscode}}</strong> · <a href="/kurse/{{.ID}}/regiepult">Zum Regiepult →</a></p>
		<img class="qr" src="/kurse/{{.ID}}/qr.png" width="160" height="160" alt="QR-Code zum Beitritt">

		<table>
			<thead>
				<tr>
					<th>Gruppe</th>
					<th>Themenfeld</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				{{range .Gruppen}}
				<tr>
					<td>Gruppe {{.Nummer}}</td>
					<td>{{if .Themenfeld}}{{.Themenfeld}}{{else}}—{{end}}</td>
					<td>
						<form method="post" action="/kurse/{{$.ID}}/gruppen/{{.Nummer}}/themenfeld">
							<select name="themenfeld" required>
								<option value="">Themenfeld wählen</option>
								{{range $.Themenfelder}}
								<option value="{{.}}">{{.}}</option>
								{{end}}
							</select>
							<button type="submit">Zuweisen</button>
						</form>
					</td>
				</tr>
				{{end}}
			</tbody>
		</table>
	</main>
</body>
</html>
