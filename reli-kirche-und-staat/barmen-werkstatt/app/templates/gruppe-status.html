<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gruppe {{.Nummer}} — Barmen-Werkstatt</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<main>
		<h1>Gruppe {{.Nummer}}</h1>
		<p>Aktueller Schritt: <strong>{{.Schritt}}</strong></p>
		{{if .HatSchreibrecht}}
		<p>Du hast das Schreibrecht.</p>
		{{else}}
		<p>Ein anderes Gerät eurer Gruppe hat gerade das Schreibrecht.</p>
		<form method="post" action="/gruppe/schreibrecht">
			<button type="submit">Schreibrecht übernehmen</button>
		</form>
		{{end}}
	</main>
</body>
</html>
