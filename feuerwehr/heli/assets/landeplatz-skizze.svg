<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" role="img" aria-labelledby="t d">
  <title id="t">Nachtlandeplatz – Aufbauvorschlag mit TSF-Beladung</title>
  <desc id="d">Rechteckige Landefläche 35 mal 70 Meter. Der Hubschrauber fliegt von links gegen den Wind an. TSF und ein Pkw stehen an den beiden linken Eckpunkten und leuchten mit Abblendlicht flach in Anflugrichtung, die Lichtkegel kreuzen sich am Landepunkt. Ein nicht ausgefahrener Teleskopscheinwerfer am Stromerzeuger leuchtet von der Seite steil auf den Landepunkt. Eine Akkuleuchte strahlt einen Baum als Hindernis an. Ein Einweiser steht optional am windabgewandten Ende mit dem Wind im Rücken.</desc>

  <rect width="720" height="460" fill="#ffffff"/>

  <!-- Wiese / Landefläche -->
  <rect x="150" y="110" width="420" height="210" fill="#e9f2e1" stroke="#4b6b3a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="360" y="100" text-anchor="middle" fill="#4b6b3a">70 m</text>
  <text x="576" y="314" fill="#4b6b3a">35 m</text>
  <text x="160" y="132" fill="#4b6b3a" font-weight="600">Landefläche mind. 35 × 70 m</text>
  <text x="160" y="147" fill="#4b6b3a">eben, fest, keine losen Gegenstände</text>

  <!-- Lichtkegel -->
  <g fill="#ffcf33" fill-opacity=".45">
    <polygon points="148,112 356.6,246.8 383.4,193.2"/>
    <polygon points="148,318 383.4,236.8 356.6,183.2"/>
    <polygon points="360,338 334,222 386,222"/>
    <polygon points="566,96 604,58 626,82"/>
  </g>

  <!-- Landepunkt: nur gedachte Markierung -->
  <g stroke="#b3261e" stroke-width="2">
    <line x1="350" y1="215" x2="370" y2="215"/>
    <line x1="360" y1="205" x2="360" y2="225"/>
  </g>
  <text x="392" y="262" fill="#b3261e">Landepunkt:</text>
  <text x="392" y="276" fill="#b3261e">Lichtkegel kreuzen sich</text>
  <text x="392" y="290" fill="#b3261e">(nichts auf den Boden legen!)</text>

  <!-- Pkw oben links -->
  <g transform="rotate(26.6 128 100)">
    <rect x="104" y="89" width="46" height="22" rx="5" fill="#5d6b7a"/>
    <rect x="136" y="92" width="8" height="16" rx="2" fill="#cfd8e3"/>
  </g>
  <text x="24" y="70">Privat-Pkw</text>
  <text x="24" y="84" fill="#555">Abblendlicht, Eckpunkt</text>

  <!-- TSF unten links -->
  <g transform="rotate(-26.6 124 330)">
    <rect x="94" y="317" width="60" height="26" rx="4" fill="#b3261e"/>
    <rect x="140" y="321" width="9" height="18" rx="2" fill="#f3d2cf"/>
    <circle cx="118" cy="330" r="5" fill="#2f6bff"/>
  </g>
  <text x="24" y="372">TSF</text>
  <text x="24" y="386" fill="#555">Abblendlicht + Blaulicht</text>
  <text x="24" y="400" fill="#555">(≥ 5 min vor Landung an)</text>

  <!-- Stativ + Stromerzeuger -->
  <rect x="352" y="336" width="16" height="10" fill="#333"/>
  <line x1="360" y1="346" x2="350" y2="362" stroke="#333" stroke-width="2"/>
  <line x1="360" y1="346" x2="370" y2="362" stroke="#333" stroke-width="2"/>
  <rect x="430" y="352" width="30" height="20" rx="3" fill="#8a5a00"/>
  <path d="M368 356 Q400 380 430 362" fill="none" stroke="#333" stroke-dasharray="3 3"/>
  <text x="300" y="384">Teleskopscheinwerfer</text>
  <text x="300" y="398" fill="#555">NICHT ausgefahren, gesichert,</text>
  <text x="300" y="412" fill="#555">steil nach unten</text>
  <text x="468" y="366">Stromerzeuger</text>

  <!-- Hindernis -->
  <circle cx="620" cy="62" r="18" fill="#3f6b2e"/>
  <rect x="616" y="78" width="8" height="14" fill="#6b4a2e"/>
  <rect x="560" y="92" width="10" height="8" rx="2" fill="#333"/>
  <text x="515" y="30">Hindernis anleuchten</text>
  <text x="515" y="44" fill="#555">(Akku-Leuchte)</text>

  <!-- Wind -->
  <line x1="700" y1="130" x2="640" y2="130" stroke="#1f1d1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="648" y="120">Wind</text>

  <!-- Einweiser -->
  <g stroke="#1f1d1a" stroke-width="2" fill="none">
    <circle cx="545" cy="196" r="5" fill="#ffcf33"/>
    <line x1="545" y1="201" x2="545" y2="220"/>
    <line x1="545" y1="205" x2="537" y2="190"/>
    <line x1="545" y1="205" x2="553" y2="190"/>
    <line x1="545" y1="220" x2="540" y2="232"/>
    <line x1="545" y1="220" x2="550" y2="232"/>
  </g>
  <text x="584" y="180">Einweiser</text>
  <text x="584" y="194" fill="#555">(optional)</text>
  <text x="584" y="208" fill="#555">Wind im</text>
  <text x="584" y="222" fill="#555">Rücken</text>

  <!-- Anflug -->
  <line x1="20" y1="215" x2="138" y2="215" stroke="#1f1d1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="20" y="205">Anflug</text>
  <text x="20" y="235" fill="#555">gegen den Wind</text>

  <!-- Absperrung -->
  <text x="150" y="436" fill="#555">Absperren mit Posten (keine Flatterbänder) · Zufahrt für RTW freihalten</text>
  <text x="150" y="451" fill="#555">Freileitungen im Umkreis von 300 m prüfen</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f1d1a"/>
    </marker>
  </defs>
</svg>
